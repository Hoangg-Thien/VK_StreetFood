services:
  - type: web
    name: vk-api
    env: docker
    plan: free
    rootDir: .
    dockerfilePath: Dockerfile.api
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: Logging__LogLevel__Default
        value: Warning
      - key: Logging__LogLevel__Microsoft__AspNetCore
        value: Warning
      - key: Logging__LogLevel__Microsoft__EntityFrameworkCore
        value: Warning
      - key: Logging__LogLevel__Microsoft__EntityFrameworkCore__Database__Command
        value: Warning
      - key: EnableHttpsRedirection
        value: "false"
      - key: ConnectionStrings__DefaultConnection
        sync: false

  - type: web
    name: vk-web
    env: docker
    plan: free
    rootDir: .
    dockerfilePath: Dockerfile.web
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: Logging__LogLevel__Default
        value: Warning
      - key: Logging__LogLevel__Microsoft__AspNetCore
        value: Warning
      - key: Logging__LogLevel__Microsoft__EntityFrameworkCore
        value: Warning
      - key: Logging__LogLevel__Microsoft__EntityFrameworkCore__Database__Command
        value: Warning
      - key: EnableHttpsRedirection
        value: "false"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: ApiSettings__BaseUrl
        sync: false
      - key: AdminAuth__Email
        sync: false
      - key: AdminAuth__Password
        sync: false
      - key: SupabaseStorage__Url
        sync: false
      - key: SupabaseStorage__ServiceRoleKey
        sync: false
      - key: SupabaseStorage__Bucket
        value: poi-images
      - key: SupabaseStorage__PublicBaseUrl
        sync: false
