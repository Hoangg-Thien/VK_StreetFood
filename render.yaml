services:
  - type: web
    name: vk-api
    env: docker
    plan: free
    dockerfilePath: ./src/Server/VK.API/Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /swagger
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false

  - type: web
    name: vk-web
    env: docker
    plan: free
    dockerfilePath: ./src/Server/VK.Web/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: ApiSettings__BaseUrl
        sync: false
      - key: AdminAuth__Email
        sync: false
      - key: AdminAuth__Password
        sync: false
