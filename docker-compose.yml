services:
  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_USER: vkstreetfood
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vkstreetfood 
    ports:
      - "5434:5432"
    volumes:
      - vk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vkstreetfood"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=vkstreetfood;Username=vkstreetfood;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: "VKStreetFood.Local"
      Jwt__Audience: "VKStreetFood.Local"
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "5001:8080"
    volumes:
      - vk_audio_data:/app/App_Data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=vkstreetfood;Username=vkstreetfood;Password=${POSTGRES_PASSWORD}"
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "5002:8080"

volumes:
  vk_postgres_data:
  vk_audio_data: